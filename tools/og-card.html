<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>og card</title><meta name="robots" content="noindex">
<!-- og.png's source since 3 Nov 2026: the commit grid. Adrian turned down the scrapbook, four plain cards and four techy
     ones (LaTeX, scoring box, receipt, datasheet), then from six more (_mock/og4) narrowed it to "A or F": the swarm or this.
     Claude shipped F, which reads best at phone size; A, the loading screen's dots, is _mock/og5/a.html.
     A commit heatmap (weekday rows, week columns, Mar to 3 Nov) whose darkest cells spell ADRIAN in a 5x7 font, one empty
     week between letters. The other cells are seeded noise, not real activity, so there are no counts anywhere. Days
     after 3 Nov 2026 are left off, as on a real graph. tools/make_og.py serves the repo and screenshots this at 1200x630. -->
<style>
@font-face{font-family:'LM Roman';src:url(/fonts/lmroman10-bold.woff2) format('woff2');font-weight:700;font-display:block}
@font-face{font-family:'LM Roman';src:url(/fonts/lmroman10-regular.woff2) format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'LM Mono';src:url(/tools/fonts/lmmono10-regular.otf) format('opentype');font-display:block}
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:#fbfaf7;color:#1f3a5f;font-family:'LM Roman',serif}
:root{--x:110px;--top:84px}
.gr{position:absolute;left:var(--x);top:var(--top);display:grid;grid-template-columns:repeat(37,24px);grid-template-rows:repeat(7,24px);gap:4px;grid-auto-flow:column}
.gr i{display:block;border-radius:5px;background:#eeeae2}
.gr i.x{background:none}
.l1{background:#d9e0ea!important}.l2{background:#aebfd6!important}.l3{background:#6f8bb1!important}.l4{background:#1f3a5f!important}
.mo{position:absolute;top:calc(var(--top) - 30px);font:400 18px/1 'LM Mono',monospace;color:#8b95a3}
.dy{position:absolute;left:58px;font:400 18px/1 'LM Mono',monospace;color:#8b95a3}
.lg{position:absolute;right:58px;top:300px;display:flex;align-items:center;gap:5px;font:400 17px/1 'LM Mono',monospace;color:#8b95a3}
.lg i{width:17px;height:17px;border-radius:4px;display:block;background:#eeeae2}
.lg span{margin:0 6px}
h1{position:absolute;left:calc(var(--x) - 4px);top:352px;margin:0;font-weight:700;font-size:88px;line-height:1;letter-spacing:-.01em;color:#1f3a5f}
.sub{position:absolute;left:var(--x);top:462px;font-size:32px;color:#4a5566}
.url{position:absolute;left:var(--x);bottom:42px;font:400 19px/1 'LM Mono',monospace;color:#8b95a3}
.loc{position:absolute;right:58px;bottom:42px;font:400 19px/1 'LM Mono',monospace;color:#8b95a3}
</style></head><body>
<div class="gr" id="g"></div>
<div class="dy" style="top:117px">Mon</div><div class="dy" style="top:173px">Wed</div><div class="dy" style="top:229px">Fri</div>
<div class="lg"><span>Less</span><i></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i><span>More</span></div>
<h1>Adrian Erlikhman</h1>
<div class="sub">ML/NLP research · software · Team USA épée</div>
<div class="url">adrianerlikhman.is-a.dev</div>
<div class="loc">Los Angeles</div>
<script>
const COLS=37,ROWS=7,X0=110;
// a classic 5x7 font; I is 3 wide
const F={A:['.###.','#...#','#...#','#####','#...#','#...#','#...#'],D:['####.','#...#','#...#','#...#','#...#','#...#','####.'],
  R:['####.','#...#','#...#','####.','#.#..','#..#.','#...#'],I:['###','.#.','.#.','.#.','.#.','.#.','###'],
  N:['#...#','#...#','##..#','#.#.#','#..##','#...#','#...#']};
const on=new Set();let cx=2;
for(const ch of 'ADRIAN'){const f=F[ch];for(let r=0;r<7;r++)for(let c=0;c<f[r].length;c++)if(f[r][c]==='#')on.add((cx+c)+','+r);cx+=f[0].length+1;}
let s=20271103;const R=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
// the graph runs from the week of Sun 22 Feb to this week (Sun 1 Nov); today is Tue 3 Nov
const start=new Date(Date.UTC(2026,1,22)), today=new Date(Date.UTC(2026,10,3));
const g=document.getElementById('g');
for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){const i=document.createElement('i');
  const day=new Date(start.getTime()+(c*7+r)*864e5);
  if(day>today) i.className='x';
  else if(on.has(c+','+r)) i.className='l4';
  else{const u=R(),wk=(r===0||r===6);
    const lv=u<(wk?.88:.75)?0:u<(wk?.99:.97)?1:2; if(lv) i.className='l'+lv;}
  g.appendChild(i);}
// month labels over the first week that holds the 1st
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];let last=-9;
for(let c=0;c<COLS;c++){for(let k=0;k<7;k++){const d=new Date(start.getTime()+(c*7+k)*864e5);
  if(d.getUTCDate()===1&&d<=today&&c-last>=3){const e=document.createElement('div');e.className='mo';e.textContent=MN[d.getUTCMonth()];e.style.left=(X0+c*28)+'px';document.body.appendChild(e);last=c;}}}
</script>
</body></html>
