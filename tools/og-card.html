<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og card</title>
<meta name="robots" content="noindex">
<!-- og.png's source (2 Nov 2026, Adrian picked B, "the scrapbook", of three takes in _mock/og.html). tools/make_og.py
     serves the repo and screenshots this page at 1200x630. Cards show at ~300-480px, so everything here is set large. -->
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght,BNCE,INFM@400..600,-100..100,0..100&family=IBM+Plex+Mono:wght@600&display=block" rel="stylesheet">
<style>
@font-face{font-family:'LM Roman';src:url(/fonts/lmroman10-bold.woff2) format('woff2');font-weight:700;font-display:block}
html,body{margin:0;padding:0}
body{width:1200px;height:630px;overflow:hidden;position:relative;background:#fbfaf7;--ink:#2457c5;-webkit-font-smoothing:antialiased}
/* the site's dot grid */
body::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#d9d6cf 1.3px,transparent 1.4px);background-size:26px 26px;opacity:.7}
.ab{position:absolute}
.k{left:76px;top:86px;font:600 17px 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#7a7a74}
.nm{left:72px;top:118px;margin:0;font:700 100px/0.98 'LM Roman',serif;color:#1f3a5f;letter-spacing:-.01em}
/* the welcome's ballpoint notes */
.hw{font-family:'Shantell Sans','Comic Sans MS',cursive;font-variation-settings:'INFM' 100,'BNCE' 30;color:var(--ink)}
.nt{left:78px;top:366px;margin:0;padding:0;list-style:none;font-size:33px;font-weight:500;line-height:56px}
.nt li:nth-child(1){transform:rotate(-1.2deg)}
.nt li:nth-child(2){transform:rotate(.6deg)}
.nt li:nth-child(3){transform:rotate(-.8deg)}
.nt u{text-decoration:none;background:linear-gradient(transparent 62%,rgba(36,87,197,.16) 62%)}
/* a taped print of the Pan-Ams lunge, and the polaroid from the welcome */
.pr{left:640px;top:58px;width:404px;padding:14px;background:#fff;box-shadow:0 18px 36px -16px rgba(0,0,0,.42),0 1px 3px rgba(0,0,0,.14);transform:rotate(-4deg)}
.pr img{display:block;width:376px;height:282px;object-fit:cover}
.tp{left:770px;top:42px;width:88px;height:28px;background:rgba(233,208,150,.78);transform:rotate(-14deg)}
.pol{left:922px;top:286px;width:228px;padding:11px 11px 12px;background:#fff;box-shadow:0 18px 36px -14px rgba(0,0,0,.45),0 1px 3px rgba(0,0,0,.14);transform:rotate(6deg)}
.pol::before{content:"";position:absolute;top:-15px;left:50%;width:96px;height:30px;transform:translateX(-50%) rotate(-4deg);background:rgba(233,208,150,.78);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.pol img{display:block;width:206px;height:206px;object-fit:cover;object-position:center 26%}
.pol span{display:block;margin-top:8px;text-align:center;font-weight:600;font-size:27px;line-height:1.1}
svg{position:absolute;left:0;top:0;overflow:visible}
svg path{fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<div class="ab k">LOS ANGELES, CALIFORNIA</div>
<h1 class="ab nm">Adrian<br>Erlikhman</h1>
<ul class="ab nt hw">
  <li>i do <u>ML/NLP research</u></li>
  <li>i build things: <u>4× hackathon winner</u></li>
  <li>i fence épée for <u>Team USA</u></li>
</ul>
<div class="ab pr"><img src="/img/about/lunge-wide.webp" alt=""></div>
<div class="ab tp"></div>
<div class="ab pol hw"><img src="/adrian.jpg" alt=""><span>hi, i’m adrian!</span></div>
<svg width="1200" height="630"><path d="M526 518 C 640 528, 760 500, 790 394"/><path d="M777 409 L790 393 L801 412"/></svg>
</body>
</html>
